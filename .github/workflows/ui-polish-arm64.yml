name: "UI polish macOS arm64"

on:
  push:
    branches: [feat/ui-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Build signed macOS arm64 app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bunx tauri build --target aarch64-apple-darwin --bundles dmg --config src-tauri/ci.conf.json
      - name: Verify DMG and bundled app signature
        shell: bash
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test -f "${dmg[0]}"
          hdiutil verify "${dmg[0]}"
          mount_point="$RUNNER_TEMP/iloader-verify"
          mkdir -p "$mount_point"
          hdiutil attach "${dmg[0]}" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/iloader.app"
          codesign -dv --verbose=2 "$mount_point/iloader.app" 2>&1 | grep 'Signature=adhoc'
          shasum -a 256 "${dmg[0]}"
      - name: Upload arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: iloader-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
