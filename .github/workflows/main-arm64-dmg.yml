name: "main macOS arm64 DMG"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-arm64-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Build macOS arm64 DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bunx tauri build --target aarch64-apple-darwin --bundles dmg --config src-tauri/ci.conf.json
      - name: Verify DMG and app signature
        shell: bash
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test -f "${dmg[0]}"
          hdiutil verify "${dmg[0]}"
          mount_point="$RUNNER_TEMP/iloader-verify"
          mkdir -p "$mount_point"
          hdiutil attach "${dmg[0]}" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/iloader.app"
          codesign -dv --verbose=2 "$mount_point/iloader.app" 2>&1 | grep 'Signature=adhoc'
          shasum -a 256 "${dmg[0]}"
      - name: Publish direct DMG download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test -f "${dmg[0]}"
          tag="ci-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${dmg[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "macOS arm64 CI #${GITHUB_RUN_NUMBER}" \
            --notes "Automated main branch DMG. Ad-hoc signed; not notarized. Source commit: ${GITHUB_SHA}" \
            --prerelease
          url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].url')"
          test -n "$url"
          checksum="$(shasum -a 256 "${dmg[0]}")"
          {
            echo "### macOS arm64 DMG"
            echo "[直接下载 DMG]($url)"
            echo
            echo "SHA-256: \`$checksum\`"
          } >> "$GITHUB_STEP_SUMMARY"
